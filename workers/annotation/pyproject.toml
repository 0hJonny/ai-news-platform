[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates, not code — line length here is about readable prompt
# text, not something wrapping would improve.
"models/GenerationModels/*.py" = ["E501"]

[tool.ruff.lint.isort]
# `shared/` lives one level up (workers/shared), only present here at
# container runtime via docker-compose's bind mount — see
# infra/docker-compose.yml and workers/parser/pyproject.toml for the same
# situation.
known-first-party = ["models", "services", "shared"]

# backend/core and backend/news are two independent Go modules (different
# go.mod, different Go toolchain versions — see each module's own go.mod)
# that happen to live in one repo. Matrix instead of one shared job so each
# gets its own go-version-file and its own golangci-lint run against its
# own .golangci.yml.
name: Lint Go backend

# No `paths:` filter here — path-based skipping now happens inside the
# `gate` job below instead, so it can also catch "go (core)"/"go (news)"
# having failed on the last completed run and re-check that module even
# when backend/<module> didn't change this time. See _gate-matrix.yml.
on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    uses: ./.github/workflows/_gate-matrix.yml
    with:
      workflow_file: lint-backend.yml
      job_name_prefix: go
      items: '["core","news"]'
      filters: |
        core:
          - 'backend/core/**'
          - '.github/workflows/lint-backend.yml'
          - '.github/workflows/_gate-matrix.yml'
        news:
          - 'backend/news/**'
          - '.github/workflows/lint-backend.yml'
          - '.github/workflows/_gate-matrix.yml'

  go:
    needs: gate
    if: needs.gate.outputs.items != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.gate.outputs.items) }}
    defaults:
      run:
        working-directory: backend/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/${{ matrix.module }}/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: backend/${{ matrix.module }}

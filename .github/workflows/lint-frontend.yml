# only frontend/src is the active app — Web-site/ is deprecated
# legacy, deliberately not linted/built here.
name: Lint frontend

# No `paths:` filter here — path-based skipping now happens inside the
# `gate` job below instead, so it can also catch "frontend failed on the
# last completed run" and re-check even when frontend/src didn't change
# this time. See _gate-single.yml.
on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    uses: ./.github/workflows/_gate-single.yml
    with:
      workflow_file: lint-frontend.yml
      job_name: frontend
      paths: |
        frontend/src/**
        .github/workflows/lint-frontend.yml
        .github/workflows/_gate-single.yml

  frontend:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/src/package.json
          cache: npm
          cache-dependency-path: frontend/src/package-lock.json

      - run: npm ci

      - run: npm run lint

      # vue-tsc catches type errors ESLint doesn't (cross-component prop
      # types, template expression types) — worth its own step so a
      # type-check failure isn't lost in the lint step's output.
      - run: npm run type-check

      - run: npm run build

# Backstop for .pre-commit-config.yaml — catches it if someone commits
# without the local hook installed (or with --no-verify). Same ruff
# version as pinned in each worker's requirements-dev.txt and
# .pre-commit-config.yaml, kept in sync by hand for now.
#
# Matrix instead of one shared job because each worker is an independent
# Docker build context with its own pyproject.toml (own line-length,
# per-file-ignores, known-first-party) — see workers/{parser,annotation,agent}/pyproject.toml.
name: Lint Python workers

# No `paths:` filter here — path-based skipping now happens inside the
# `gate` job below instead, so it can also catch "ruff (<worker>)" having
# failed on the last completed run and re-check that worker even when
# workers/<worker> didn't change this time. See _gate-matrix.yml.
on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    uses: ./.github/workflows/_gate-matrix.yml
    with:
      workflow_file: lint-python-workers.yml
      job_name_prefix: ruff
      items: '["parser","annotation","agent"]'
      filters: |
        parser:
          - 'workers/parser/**'
          - '.github/workflows/lint-python-workers.yml'
          - '.github/workflows/_gate-matrix.yml'
        annotation:
          - 'workers/annotation/**'
          - '.github/workflows/lint-python-workers.yml'
          - '.github/workflows/_gate-matrix.yml'
        agent:
          - 'workers/agent/**'
          - '.github/workflows/lint-python-workers.yml'
          - '.github/workflows/_gate-matrix.yml'

  ruff:
    needs: gate
    if: needs.gate.outputs.items != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.gate.outputs.items) }}
    steps:
      - uses: actions/checkout@v7

      - name: ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.6"
          src: "workers/${{ matrix.worker }}"

      - name: ruff format --check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.6"
          src: "workers/${{ matrix.worker }}"
          args: "format --check"

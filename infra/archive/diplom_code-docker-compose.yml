services:
  # Init Database
  # Postgres
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    build:
      context: ../postgres
      dockerfile: Dockerfile
      args:
        ADMIN_USERNAME: ${ADMIN_USERNAME}
        ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    shm_size: 1g
    # restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - /opt/postgres/backup:/opt/postgres/backup
      # - /opt/exchange:/opt/exchange
      # - ../postgres/initdb:/docker-entrypoint-initdb.d
    ports:
      - ${DATASOURCE_PORT}:5432
    environment:
      LANG: en_US.utf8
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en_US"
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
      DATASOURCE_DB_USERS: ${DATASOURCE_DB_USERS}
      DATASOURCE_USER: ${DATASOURCE_USER}
      TZ: "Asia/Yekaterinburg"
      PGTZ: "Asia/Yekaterinburg"
    networks:
      - db_network

  # PgAdmin
  pgadmin:
    container_name: ${COMPOSE_PROJECT_NAME}-pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      TZ: "GMT+5"
      PGTZ: "GMT+5"
    ports:
      - 5050:5050
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # # restart: always
    networks:
      - db_network

  # Minio
  minio:
    container_name: ${COMPOSE_PROJECT_NAME}-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - "${MINIO_API_PORT}:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
      # - /opt/exchange:/opt/exchange
    command: server /data --console-address ":9001"
    networks:
      - app_network
    # restart: always

  # Python Server

  #     - golang-server
  #   networks:
  #     - app_network

  # annotator
  # python-annotator:
  #   build:
  #     context: ../Server/Annotation
  #     dockerfile: Dockerfile
  #   environment:
  #     GOLANG_API: http://golang-server:5000/api/v1
  #     API_OLLAMA_URL: http://ollama-hub:11434
  #     API_USER_LOGIN: ${ADMIN_USERNAME}
  #     API_USER_PASSWORD: ${ADMIN_PASSWORD}
  #   volumes:
  #     - ../Server/Annotation:/app
  #   # restart: always
  #   depends_on:
  #     - golang-server
  #   networks:
  #     - app_network
  #     - ollama_network

  # Ollama hub
  # ollama-hub:
  #   build:
  #     context: ../ollama
  #     dockerfile: Dockerfile
  #   # runtime: nvidia
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   # restart: always
  #   depends_on:
  #     - golang-server

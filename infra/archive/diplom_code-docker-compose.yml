# Volumes
volumes:
  ollama_data:
    name: ${COMPOSE_PROJECT_NAME}-ollama_data
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}-postgres_data
  pgadmin_data:
    name: ${COMPOSE_PROJECT_NAME}-pgadmin_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME}-minio_data

# Networks
networks:
  db_network:
    name: ${COMPOSE_PROJECT_NAME}-db_network
    driver: bridge
  ollama_network:
    name: ${COMPOSE_PROJECT_NAME}-ollama_network
    driver: bridge
  app_network:
    name: ${COMPOSE_PROJECT_NAME}-app_network
    driver: bridge

  #   networks:
  #     - ollama_network

  # Go Server
  golang-server:
    container_name: ${COMPOSE_PROJECT_NAME}-golang-server
    build:
      context: ../Server/Backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_DATABASE_URL: postgres
      POSTGRES_USERNAME: ${DATASOURCE_USER}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
      POSTGRES_ARTICLES: ${DATASOURCE_DB_ARTICLES}
      POSTGRES_USERS: ${DATASOURCE_DB_USERS}
      POSTGRES_PORT: "5432"
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_HOST: minio
      MINIO_PORT: ${MINIO_API_PORT}
    ports:
      - "5001:5000"
    volumes:
      - ../Server/Backend:/app/data
    # restart: always
    depends_on:
      - postgres
      - minio
    networks:
      - db_network
      - app_network

  vue-new-app:
    container_name: ${COMPOSE_PROJECT_NAME}-vue-app
    environment:
      GOLANG_API: golang-server:5000
    build:
      context: ../src
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ../src:/app
      # - /app/node_modules
    # restart: always
    depends_on:
      - golang-server
    networks:
      - app_network

  # Init Web
  vue-app:
    container_name: ${COMPOSE_PROJECT_NAME}-vue-app-old
    environment:
      GOLANG_API: golang-server:5000
    build:
      context: ../Web-site
      dockerfile: Dockerfile
    ports:
      - "3002:3001"
    volumes:
      - ../Web-site:/app
      # - /app/node_modules
    # restart: always
    depends_on:
      - golang-server
    networks:
      - app_network

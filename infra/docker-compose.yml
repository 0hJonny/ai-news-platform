name: ai_news_platform

networks:
  platform-network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
  minio_data:
  pgadmin_data:
  redis_data:

services:
  # =========================================================================
  # Infrastructure
  # =========================================================================
  postgres:
    build:
      context: ./postgres
    container_name: platform-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: platform-chromadb
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      # Neither curl nor python3 exist in this image — Chroma's core is a
      # compiled Rust binary now (see ASAN_OPTIONS/RUST_BACKTRACE in the
      # container env, entrypoint is just dumb-init + the chroma binary).
      # It IS a Debian base with the usual coreutils/perl though (confirmed
      # via `ls /usr/bin` inside the container), so use perl's core
      # IO::Socket::INET — no extra modules needed — to open a raw socket
      # and check for an HTTP 200. /api/v2/heartbeat is the right endpoint,
      # verified via curl from the host: /api/v1/heartbeat now 410s ("v1
      # API is deprecated"). Every literal $ below is doubled ($$) — Compose
      # interpolates $VAR in any compose-file string regardless of YAML
      # quoting, so an unescaped $s/$r/$/ silently becomes blank instead of
      # reaching Perl (learned this the hard way: "my  = IO::Socket...").
      test:
        - CMD
        - perl
        - -MIO::Socket::INET
        - -e
        - 'my $$s = IO::Socket::INET->new(PeerAddr => "localhost", PeerPort => 8000, Timeout => 3) or exit 1; print $$s "GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n"; my $$r = do { local $$/; <$$s> }; exit($$r =~ /^HTTP\/1\.[01] 200/ ? 0 : 1);'
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - platform-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - platform-network

  # Broker for the Celery pipeline (workers/shared/celery_app.py) —
  # parsing_queue / annotation_queue live here.
  redis:
    image: redis:7-alpine
    container_name: platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: platform-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - platform-network

  # Runs the goose migrations once for the auth, chats, news, profiles schemas
  # (in that exact order — chats.sessions references auth.users, profiles.*
  # references auth.users and news.articles) on top of the single ${POSTGRES_DB},
  # then exits 0. Application services wait for it to complete successfully (see migrate/migrate.sh).
  migrate:
    build:
      context: ./migrate
    container_name: platform-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ../backend/core/sql:/sql/core:ro
      - ../backend/news/sql:/sql/news:ro
    networks:
      - platform-network

  # =========================================================================
  # backend/core (news_agent) — auth, chats, gateway. Shared go.mod, left untouched.
  # =========================================================================
  auth:
    build:
      context: ../backend/core
      dockerfile: dockerfile.dev
    container_name: platform-auth
    working_dir: /app
    volumes:
      - ../backend/core:/app
      # Canonical login/username format contract (also read directly by the
      # frontend via its own "@shared" alias) — see
      # backend/core/internal/auth/domain/user.go (loginRulesPath).
      - ../shared:/shared
    command: ["go", "run", "./cmd/auth"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8081"
      GRPC_PORT: "50051"
      LOGIN_RULES_PATH: /shared/auth/login-rules.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - platform-network

  chats:
    build:
      context: ../backend/core
      dockerfile: dockerfile.dev
    container_name: platform-chats
    working_dir: /app
    volumes:
      - ../backend/core:/app
    command: ["go", "run", "./cmd/chats"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - platform-network

  gateway:
    build:
      context: ../backend/core
      dockerfile: dockerfile.dev
    container_name: platform-gateway
    working_dir: /app
    volumes:
      - ../backend/core:/app
    command: ["go", "run", "./cmd/gateway"]
    environment:
      PORT: "8080"
      AUTH_GRPC_ADDR: "auth:50051"
      AUTH_HTTP_ADDR: "http://auth:8081"
      AGENTS_HTTP_ADDR: "http://agent:8000"
      CHATS_HTTP_ADDR: "http://chats:8082"
      NEWS_HTTP_ADDR: "http://news:5000"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      auth:
        condition: service_healthy
      chats:
        condition: service_healthy
      agent:
        condition: service_healthy
      news:
        condition: service_healthy
    networks:
      - platform-network

  # =========================================================================
  # backend/news (Diplom_Code) — standalone Gin/GORM service, its own go.mod.
  # Single connection to ${POSTGRES_DB}, GORM looks up tables via
  # search_path=news,profiles,public (see src/models/db.go).
  # =========================================================================
  news:
    build:
      context: ../backend/news
    container_name: platform-news
    working_dir: /app/data
    volumes:
      - ../backend/news:/app/data
    command: ["go", "run", "app.go"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_HOST: minio
      MINIO_PORT: "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    networks:
      - platform-network

  # =========================================================================
  # workers/agent — LangGraph FastAPI agent (news_agent/app)
  # =========================================================================
  agent:
    build:
      context: ../workers/agent
      dockerfile: dockerfile
    container_name: platform-agent
    volumes:
      - ../workers/agent:/app
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION: ${CHROMA_COLLECTION}
      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      CORS_ORIGINS: ${ALLOWED_ORIGINS}
      GO_CHAT_SERVICE: "http://chats:8082/api/v1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - platform-network

  # =========================================================================
  # workers/parser, workers/annotation — background jobs (Diplom_Code).
  # profiles: [jobs] => do NOT start on plain `docker compose up`, only explicitly:
  #   docker compose --profile jobs up parser parser-producer
  #   docker compose --profile jobs up annotation
  # =========================================================================
  parser:
    profiles: ["jobs"]
    build:
      context: ../workers/parser
    container_name: platform-parser
    volumes:
      - ../workers/parser:/app
      # Shared Celery app/queue config (workers/shared/celery_app.py),
      # imported as `from shared.celery_app import app` — same
      # mount-a-sibling-dir-in pattern already used for backend/core's
      # login-rules contract elsewhere in this file.
      - ../workers/shared:/app/shared:ro
    environment:
      GOLANG_API: "http://news:5000/api/v1"
      API_USER_LOGIN: ${ADMIN_USERNAME}
      API_USER_PASSWORD: ${ADMIN_PASSWORD}
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      news:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  # Same image as `parser`, but overrides its default CMD (the Celery
  # consumer) with `cron -f` so /etc/cron.d/cronjob actually runs — that's
  # the producer side of the pipeline: periodically walks source listings
  # and enqueues parsing.scrape_source for new links (see producer.py).
  # Split into its own service rather than folded into `parser` itself to
  # keep one process per container instead of running cron + celery worker
  # together in one.
  parser-producer:
    profiles: ["jobs"]
    build:
      context: ../workers/parser
    container_name: platform-parser-producer
    command: ["cron", "-f"]
    volumes:
      - ../workers/parser:/app
      - ../workers/shared:/app/shared:ro
    environment:
      GOLANG_API: "http://news:5000/api/v1"
      API_USER_LOGIN: ${ADMIN_USERNAME}
      API_USER_PASSWORD: ${ADMIN_PASSWORD}
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      news:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  annotation:
    profiles: ["jobs"]
    build:
      context: ../workers/annotation
    container_name: platform-annotation
    volumes:
      - ../workers/annotation:/app
      - ../workers/shared:/app/shared:ro
    environment:
      GOLANG_API: "http://news:5000/api/v1"
      API_USER_LOGIN: ${ADMIN_USERNAME}
      API_USER_PASSWORD: ${ADMIN_PASSWORD}
      API_OLLAMA_URL: ${OLLAMA_BASE_URL}
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      news:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  # =========================================================================
  # frontend (Diplom_Code/src)
  # http.ts now points at API_BASE_URL from src/api/endpoints.ts (the Gateway,
  # localhost:8080) instead of the old hardcoded backend URL.
  # =========================================================================
  frontend:
    build:
      context: ../frontend/src
    container_name: platform-frontend
    working_dir: /app
    volumes:
      - ../frontend/src:/app
      # Canonical login/username format contract, read via the "@shared"
      # alias in vite.config.ts (also read directly by the auth service —
      # see backend/core/internal/auth/domain/user.go, loginRulesPath).
      - ../shared:/shared
    command: ["sh", "-c", "npm install && npm run dev -- --host --port 3001"]
    environment:
      VITE_IMAGE_BASE_URL: "http://localhost:9000"
    ports:
      - "3001:3001"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - platform-network
